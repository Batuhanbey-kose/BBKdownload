name: Hata bildirimi
description: Tekrarlanabilir bir uygulama hatasını bildirin
title: "[Hata]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Çerez, parola, token, özel hesap bağlantısı veya kişisel bilgi paylaşmayın.
  - type: input
    id: version
    attributes:
      label: Uygulama sürümü
      placeholder: "Örnek: 0.1.4"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Cihaz ve Android sürümü
      placeholder: "Örnek: Android 13, ARM64"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: İçerik platformu
      options:
        - YouTube
        - TikTok
        - Instagram
        - X / Twitter
        - Reddit
        - Facebook
        - Threads
        - Diğer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tekrarlama adımları
      description: Özel bağlantıları ve hesap bilgilerini gizleyin.
      placeholder: |
        1. Uygulamayı açtım
        2. Herkese açık bir bağlantı girdim
        3. Video modunu seçtim
        4. ... hatası oluştu
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen davranış ve hata metni
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Gizlilik kontrolü
      options:
        - label: Raporda çerez, parola, token veya kişisel bilgi bulunmadığını kontrol ettim.
          required: true
